version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      # Use single-node discovery for local development
      - discovery.type=single-node
      # Enable security features
      - xpack.security.enabled=false
      # Limit Elasticsearch RAM (2GB)
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elastic-network
    # Required kernel setting for Elasticsearch
    ulimits:
      memlock:
        soft: -1
        hard: -1

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      # Connect Kibana to the Elasticsearch container
      - "ELASTICSEARCH_HOSTS=http://elasticsearch:9200"
    networks:
      - elastic-network
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.2
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log:/var/log:ro
    networks:
      - elastic-network
    depends_on:
      - elasticsearch

volumes:
  esdata:
    driver: local

networks:
  elastic-network:
    driver: bridge